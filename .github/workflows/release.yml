name: Release APK

# Ao empurrar uma tag v* (ex.: v0.1.0): testa, gera o APK no EAS (perfil preview)
# e publica uma release no GitHub com o APK anexado.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Conferir se a tag bate com a versão do app
        run: |
          versao=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME}" != "v${versao}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão do app.json (v${versao})." >&2
            exit 1
          fi

      - run: npm ci

      - name: Typecheck, lint e testes
        run: |
          npx tsc --noEmit
          npx expo lint
          npm test

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build do APK no EAS
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "O EAS não devolveu o link do APK:" >&2
            cat build.json >&2
            exit 1
          fi
          curl -fL "$url" -o "joaChrono-${GITHUB_REF_NAME}.apk"

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "joaChrono-${GITHUB_REF_NAME}.apk" \
            --title "joaChrono ${GITHUB_REF_NAME#v}" \
            --generate-notes
